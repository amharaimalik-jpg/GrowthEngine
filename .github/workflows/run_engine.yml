name: GrowthEngine Automated Backend

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install aiohttp pandas streamlit

    - name: Run High-Concurrency Outreach Engine
      run: python outreach_engine.py

    - name: Generate Outreach Campaign Leads
      run: python dispatcher.py

    - name: Commit and Push Updated Database & Leads
      run: |
        git config --global user.name "GrowthEngine Automation Bot"
        git config --global user.email "bot@growthengine.auto"
        git add growth_data.db outreach_campaign_leads.csv
        git commit -m "Auto-update: Mass Audit & Outreach Leads [skip ci]" || exit 0
        git push
